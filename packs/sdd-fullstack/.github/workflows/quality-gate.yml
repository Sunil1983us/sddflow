name: Quality Gate (AI-5)
# Enforces the constitution.md / manifest.yml rules at CI time:
#  - PR size (max_lines_per_pr / max_files_per_pr from manifest.yml)
#  - PR references TASK-NNN or CHG-NNN (constitution.md Git rule)
#  - Backend build + tests + coverage gate (constitution Part 2 — Coverage Gate)
#  - Frontend build + tests + lint + coverage gate
#  - Secret scan (security-design.md §2)
#  - Dependency / SCA scan — backend (OWASP dependency-check-maven) AND
#    frontend (npm audit) (security-design.md §2)
#
# This is a starter workflow — adjust the build/test commands for your
# Tech Stack (constitution.md Part 2). Defaults assume Java + Maven
# (backend) and Node + npm (frontend).
#
# Only applies when manifest.workflow_mode == "github". In "local" mode
# (no GitHub), the agent runs these same checks itself during /implement
# — see HOW-TO-USE.md "Workflow Mode".

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-size-check:
    name: PR size + reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read PR limits from manifest.yml
        id: limits
        run: |
          MAX_LINES=$(grep -A2 'pr_rules:' .specify/manifest.yml | grep max_lines_per_pr | grep -o '[0-9]\+')
          MAX_FILES=$(grep -A2 'pr_rules:' .specify/manifest.yml | grep max_files_per_pr | grep -o '[0-9]\+')
          echo "max_lines=${MAX_LINES:-400}" >> "$GITHUB_OUTPUT"
          echo "max_files=${MAX_FILES:-5}" >> "$GITHUB_OUTPUT"

      - name: Check changed files + lines
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l)
          LINES_CHANGED=$(git diff --shortstat "$BASE_SHA" "$HEAD_SHA" | grep -oE '[0-9]+ insertion|[0-9]+ deletion' | grep -oE '[0-9]+' | paste -sd+ | bc || echo 0)
          echo "Files changed: $FILES_CHANGED (limit ${{ steps.limits.outputs.max_files }})"
          echo "Lines changed: $LINES_CHANGED (limit ${{ steps.limits.outputs.max_lines }})"
          if [ "$FILES_CHANGED" -gt "${{ steps.limits.outputs.max_files }}" ]; then
            echo "::error::PR touches $FILES_CHANGED files — exceeds max_files_per_pr (${{ steps.limits.outputs.max_files }}). Split per the SPLIT A/B/C contract."
            exit 1
          fi
          if [ "$LINES_CHANGED" -gt "${{ steps.limits.outputs.max_lines }}" ]; then
            echo "::error::PR changes $LINES_CHANGED lines — exceeds max_lines_per_pr (${{ steps.limits.outputs.max_lines }}). Split per the SPLIT A/B/C contract."
            exit 1
          fi

      - name: Check PR references TASK-NNN or CHG-NNN
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! echo "$PR_TITLE $PR_BODY" | grep -qE 'TASK-[0-9]+|CHG-[0-9]+'; then
            echo "::error::PR title/body must reference TASK-NNN or CHG-NNN (constitution.md Git rule)."
            exit 1
          fi

  backend-build-test-coverage:
    name: Backend — build, test, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build + unit + integration tests
        run: mvn -B verify

      - name: Enforce coverage gate
        run: |
          # This does NOT itself compute or check a coverage percentage --
          # it verifies that jacoco-maven-plugin's <rules> block actually
          # exists in pom.xml (which is what makes `mvn -B verify` above
          # fail the build below the threshold from constitution.md Part 2
          # Coverage Gate row). Without this check, an unconfigured
          # pom.xml lets `mvn -B verify` pass with zero coverage
          # enforcement while this job still shows green.
          if ! grep -q "jacoco-maven-plugin" pom.xml 2>/dev/null; then
            echo "::error::Coverage gate NOT enforced -- jacoco-maven-plugin not found in pom.xml. Add it with a <rules> block bound to the verify phase (threshold: constitution.md Part 2 Coverage Gate row) before this check can pass."
            exit 1
          fi
          if ! grep -q "<rules>" pom.xml 2>/dev/null; then
            echo "::error::Coverage gate NOT enforced -- jacoco-maven-plugin is present in pom.xml but has no <rules> block, so 'mvn -B verify' never actually checks coverage. Add a <rule><element>BUNDLE</element><limits><limit><counter>LINE</counter><value>COVEREDRATIO</value><minimum>{threshold}</minimum></limit></limits></rule> block (threshold: constitution.md Part 2 Coverage Gate row)."
            exit 1
          fi
          echo "jacoco-maven-plugin <rules> block found in pom.xml -- coverage was enforced by 'mvn -B verify' above."

  frontend-build-test-coverage:
    name: Frontend — build, test, lint, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + component tests with coverage
        run: npm test -- --coverage

      - name: Production build
        run: npm run build

      - name: Enforce coverage gate
        run: |
          # This does NOT itself compute or check a coverage percentage --
          # it verifies that a coverage threshold is actually configured
          # (vitest.config/jest.config "coverageThreshold"/"thresholds",
          # or package.json), which is what makes the test run above fail
          # below the value from constitution.md Part 2 Coverage Gate row.
          # Without this check, an unconfigured test runner lets "npm
          # test -- --coverage" pass with zero coverage enforcement while
          # this job still shows green.
          CONFIG_FILE=""
          for f in vitest.config.ts vitest.config.js vitest.config.mts jest.config.ts jest.config.js jest.config.cjs package.json; do
            if [ -f "$f" ] && grep -qE "coverageThreshold|thresholds" "$f"; then
              CONFIG_FILE="$f"
              break
            fi
          done
          if [ -z "$CONFIG_FILE" ]; then
            echo "::error::Coverage gate NOT enforced -- no coverageThreshold/thresholds config found in vitest.config.*/jest.config.*/package.json. Add one (threshold: constitution.md Part 2 Coverage Gate row) before this check can pass."
            exit 1
          fi
          echo "Coverage threshold config found in $CONFIG_FILE -- coverage was enforced by the test run above."

  secret-scan:
    name: Secret scan (security-design.md §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency / SCA scan (security-design.md §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Backend — OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check
        continue-on-error: true # remove once a baseline suppression file exists

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Frontend — npm audit
        run: npm audit --audit-level=high
        continue-on-error: true # remove once a baseline/allowlist exists

# ── Optional: performance gate (full scope) ──────────────────────────────────
# Uncomment to enforce the PERF-NNN thresholds from qa-testcases.md at CI time.
# Requires a running test environment (adjust the k6 target URL) and the k6
# scripts generated by the PERF-NNN tasks under perf/. See constitution.md
# Part 2 Testing row for the tool choice (k6 / Gatling / Locust / JMeter).
