name: Maintainer Repo CI
# Tests this repo's own tooling (cli-python, cli, the _shared sync system) —
# NOT a quality gate for end-user projects. That lives at
# packs/{pack}/.github/workflows/quality-gate.yml and is copied into a
# user's project by `sdd init` (see scaffold.py — full pack tree, no
# exclusions).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sync-drift-check:
    name: Shared blocks are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sync-blocks.sh
        run: bash packs/_shared/sync-blocks.sh
      - name: Fail if sync produced uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::_shared/ and the packs are out of sync. Run 'bash packs/_shared/sync-blocks.sh' locally and commit the result."
            exit 1
          fi

  setup-smoke-tests:
    name: setup.sh smoke tests (non-interactive, injection-class inputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test-setup.sh (sdd-universal)
        run: bash packs/_shared/tests/test-setup.sh
      - name: Run test-setup-micro.sh (sdd-micro)
        run: bash packs/_shared/tests/test-setup-micro.sh

  cross-reference-check:
    name: Prompt cross-references resolve (no dead "Action N" / "§N" pointers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check-cross-references.py
        run: python3 packs/_shared/tests/check-cross-references.py

  output-assertions:
    name: Worked example passes output assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run assert-output.sh against examples/todo-api
        run: |
          bash packs/_shared/tests/assert-output.sh \
            examples/todo-api/.specify/features/task-management pilot
      - name: Run assert-output.sh against examples/habit-tracker-web
        run: |
          bash packs/_shared/tests/assert-output.sh \
            examples/habit-tracker-web/.specify/features/habit-log pilot

  yaml-validate:
    name: Validate YAML templates and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate every .yml file parses
        run: |
          status=0
          while IFS= read -r -d '' f; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::Invalid YAML"; status=1; }
          done < <(find . -name "*.yml" -not -path "*/node_modules/*" -not -path "*/.git/*" -print0)
          exit $status

  python-cli-sanity:
    name: Python CLI installs and imports cleanly
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install cli-python
        run: pip install ./cli-python
      - name: Byte-compile all modules
        run: python3 -m py_compile $(find cli-python/sdd -name "*.py")
      - name: Smoke test the entry point
        run: sdd --help
      - name: Unit tests
        run: |
          pip install pytest
          python3 -m pytest cli-python/tests -q

  python-cli-coverage:
    name: Python CLI coverage threshold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cli-python + coverage
        run: |
          pip install ./cli-python
          pip install pytest coverage
      - name: Run tests under coverage and enforce the threshold
        working-directory: cli-python
        run: |
          coverage run -m pytest tests -q
          coverage report

  python-cli-lint:
    name: Python CLI lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff and mypy
        run: pip install ruff mypy
      - name: Run ruff check
        working-directory: cli-python
        run: ruff check .
      - name: Run ruff format --check
        working-directory: cli-python
        run: ruff format --check .
      - name: Run mypy
        working-directory: cli-python
        run: mypy --ignore-missing-imports sdd/
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        working-directory: cli-python
        run: bandit -r sdd/ -c pyproject.toml

  python-min-deps:
    name: Python CLI runs with minimum declared dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate a constraints file pinning every dependency to its declared floor
        run: |
          python3 - <<'PYEOF'
          import re
          text = open("cli-python/pyproject.toml").read()
          deps_block = re.search(r"dependencies = \[(.*?)\]", text, re.DOTALL).group(1)
          lines = []
          for m in re.finditer(r'"([A-Za-z0-9_.-]+)>=([0-9][0-9A-Za-z.]*)"', deps_block):
              lines.append(f"{m.group(1)}=={m.group(2)}")
          open("constraints-min.txt", "w").write("\n".join(lines) + "\n")
          print(open("constraints-min.txt").read())
          PYEOF
      - name: Install cli-python pinned to its declared minimum versions
        run: pip install -c constraints-min.txt ./cli-python
      - name: Unit tests against the minimum-version floor
        run: |
          pip install pytest
          python3 -m pytest cli-python/tests -q

  pip-audit:
    name: pip-audit (dependency vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install cli-python into a clean environment
        run: |
          python -m pip install --upgrade pip setuptools
          pip install ./cli-python
          pip install pip-audit
      - name: Run pip-audit against the resolved dependency tree
        run: pip-audit

  windows-setup-smoke-test:
    name: setup.ps1 smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run setup.ps1 in a scratch copy of sdd-universal
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "sdd-universal-test"
          Copy-Item -Recurse "packs/sdd-universal" $work
          Set-Location $work
          .\setup.ps1 -Project "Windows Smoke Test" -Feature "smoke-feature" -Type backend-service -Scope pilot
      - name: Assert manifest.yml was populated
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "sdd-universal-test"
          $content = Get-Content (Join-Path $work ".specify\manifest.yml") -Raw
          $checks = @(
            'name: "Windows Smoke Test"',
            'feature: "smoke-feature"',
            'project_type: "backend-service"',
            'scope: "pilot"'
          )
          $failed = $false
          foreach ($c in $checks) {
            if ($content -notmatch [regex]::Escape($c)) {
              Write-Error "manifest.yml missing expected value: $c"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "manifest.yml populated correctly"
      - name: Assert context file and feature directory were created
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "sdd-universal-test"
          $contextFile = Join-Path $work ".specify\contexts\smoke-feature.md"
          $featureDir  = Join-Path $work ".specify\features\smoke-feature"
          if (-not (Test-Path $contextFile)) { Write-Error "context file not created: $contextFile"; exit 1 }
          if (-not (Test-Path $featureDir))  { Write-Error "feature directory not created: $featureDir"; exit 1 }
          Write-Host "context file and feature directory present"
      - name: Reject an embedded double-quote in -Project (injection-class input)
        shell: pwsh
        run: |
          $work2 = Join-Path $env:RUNNER_TEMP "sdd-universal-test-2"
          Copy-Item -Recurse "packs/sdd-universal" $work2
          Set-Location $work2
          # Invoked as a genuinely separate process (pwsh -File), not via the
          # & call operator -- setup.ps1's own `exit 1` on rejection runs in
          # the SAME runspace under `&`, which kills this whole step before
          # the check below ever runs. A child process isolates that exit to
          # itself and reports it back through $LASTEXITCODE instead.
          pwsh -NoProfile -File .\setup.ps1 -Project 'bad"name' -Feature "smoke-feature" -Type backend-service
          if ($LASTEXITCODE -eq 0) {
            Write-Error "setup.ps1 should reject a double-quote in -Project but exited 0"
            exit 1
          }
          Write-Host "embedded double-quote correctly rejected (exit $LASTEXITCODE)"
          # GitHub Actions checks $LASTEXITCODE again when a `shell: pwsh`
          # script block ends, regardless of the control flow above -- left
          # at 1 from the child process call, it would fail this step even
          # though the assertion above passed. Reset it explicitly.
          exit 0

  package-verify:
    name: Wheel/sdist actually bundle packs (clean-install sdd init works)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bundle packs into cli-python/sdd/packs (mirrors publish.sh Step 1)
        run: |
          set -euo pipefail
          dest="cli-python/sdd/packs"
          rm -rf "$dest"
          mkdir -p "$dest"
          for pack in sdd-backend-service sdd-frontend-spa sdd-fullstack sdd-mobile sdd-universal sdd-micro; do
            cp -r "packs/$pack" "$dest/$pack"
          done
      - name: Install the build frontend
        run: pip install build
      - name: Build sdist + wheel (uv build/twine equivalent -- exercises the sdist->wheel path, not just --wheel)
        working-directory: cli-python
        run: python3 -m build
      - name: Assert both the wheel and the sdist actually contain the bundled packs
        working-directory: cli-python
        run: |
          python3 - <<'PYEOF'
          import glob
          import sys
          import tarfile
          import zipfile

          needle = "sdd/packs/sdd-universal/setup.sh"

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
          if not any(n.endswith(needle) for n in names):
              sys.exit(f"::error::{wheel} is missing {needle} -- packaging bundling is broken")
          print(f"OK: {wheel} contains {needle}")

          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as tf:
              names = tf.getnames()
          if not any(n.endswith(needle) for n in names):
              sys.exit(f"::error::{sdist} is missing {needle} -- sdist silently dropped the gitignored packs dir")
          print(f"OK: {sdist} contains {needle}")
          PYEOF
      - name: Install the wheel into a clean venv outside the repo
        run: |
          set -euo pipefail
          wheel="$(ls "$GITHUB_WORKSPACE"/cli-python/dist/*.whl)"
          python3 -m venv "$RUNNER_TEMP/clean_venv"
          "$RUNNER_TEMP/clean_venv/bin/pip" install "$wheel"
      - name: Run sdd init from a real-world project dir (no git checkout, no dev fallback)
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/real_world_project"
          mkdir -p "$work"
          cd "$work"
          "$RUNNER_TEMP/clean_venv/bin/sdd" init \
            -p "Package Verify Test" -f "smoke-feature" \
            -t backend-service --pack sdd-backend-service -s pilot \
            --plan-mode unified --reading-mode auto --ai-tool other \
            < /dev/null
          test -f ".specify/manifest.yml" || { echo "::error::manifest.yml not created by a clean-install sdd init"; exit 1; }
          grep -q 'sdd_version' ".specify/manifest.yml" || { echo "::error::manifest.yml missing sdd_version"; exit 1; }
          echo "OK: sdd init succeeded from a clean pip install outside the repo"
      - name: Clean up bundled packs from the source tree (mirrors publish.sh Step 5)
        if: always()
        run: rm -rf cli-python/sdd/packs

  node-cli-sanity:
    name: Node CLI installs and runs cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: cli
        run: npm install
      - name: Run tests
        working-directory: cli
        run: npm test
      - name: Smoke test the entry point
        working-directory: cli
        run: node bin/sdd.js --help
