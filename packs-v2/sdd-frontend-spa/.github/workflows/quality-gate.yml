name: Quality Gate (AI-5)
# Enforces the constitution.md / manifest.yml rules at CI time:
#  - PR size (max_lines_per_pr / max_files_per_pr from manifest.yml)
#  - PR references TASK-NNN or CHG-NNN (constitution.md Git rule)
#  - Build + unit/component tests + coverage gate (constitution Part 2 —
#    Coverage Gate)
#  - Secret scan (security-design.md §2)
#  - Dependency / SCA scan (security-design.md §2)
#
# This is a starter workflow — adjust the build/test commands for your
# Tech Stack (constitution.md Part 2). Defaults assume a Node-based SPA
# (React/Vue/Angular) + npm, with Vitest/Jest + Testing Library.
#
# Browser E2E tests (Playwright/Cypress) are intentionally a SEPARATE
# job/workflow — they are typically slower and run on a schedule or
# pre-release, not on every PR.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-size-check:
    name: PR size + reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read PR limits from manifest.yml
        id: limits
        run: |
          MAX_LINES=$(grep -A2 'pr_rules:' .specify/manifest.yml | grep max_lines_per_pr | grep -o '[0-9]\+')
          MAX_FILES=$(grep -A2 'pr_rules:' .specify/manifest.yml | grep max_files_per_pr | grep -o '[0-9]\+')
          echo "max_lines=${MAX_LINES:-400}" >> "$GITHUB_OUTPUT"
          echo "max_files=${MAX_FILES:-5}" >> "$GITHUB_OUTPUT"

      - name: Check changed files + lines
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES_CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l)
          LINES_CHANGED=$(git diff --shortstat "$BASE_SHA" "$HEAD_SHA" | grep -oE '[0-9]+ insertion|[0-9]+ deletion' | grep -oE '[0-9]+' | paste -sd+ | bc || echo 0)
          echo "Files changed: $FILES_CHANGED (limit ${{ steps.limits.outputs.max_files }})"
          echo "Lines changed: $LINES_CHANGED (limit ${{ steps.limits.outputs.max_lines }})"
          if [ "$FILES_CHANGED" -gt "${{ steps.limits.outputs.max_files }}" ]; then
            echo "::error::PR touches $FILES_CHANGED files — exceeds max_files_per_pr (${{ steps.limits.outputs.max_files }}). Split per the SPLIT A/B/C contract."
            exit 1
          fi
          if [ "$LINES_CHANGED" -gt "${{ steps.limits.outputs.max_lines }}" ]; then
            echo "::error::PR changes $LINES_CHANGED lines — exceeds max_lines_per_pr (${{ steps.limits.outputs.max_lines }}). Split per the SPLIT A/B/C contract."
            exit 1
          fi

      - name: Check PR references TASK-NNN or CHG-NNN
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! echo "$PR_TITLE $PR_BODY" | grep -qE 'TASK-[0-9]+|CHG-[0-9]+'; then
            echo "::error::PR title/body must reference TASK-NNN or CHG-NNN (constitution.md Git rule)."
            exit 1
          fi

  build-test-coverage:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + type-check
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Run unit + component tests with coverage
        run: npm test -- --coverage

      - name: Enforce coverage gate
        run: |
          # Coverage Gate value comes from constitution.md Part 2 — Tech
          # Stack table. Configure Vitest/Jest's coverage.thresholds (or
          # coverageThreshold) to fail the build below that threshold.
          echo "Coverage gate enforced via coverage.thresholds in vitest.config.ts / jest.config.js"

      - name: Build production bundle
        run: npm run build

  secret-scan:
    name: Secret scan (security-design.md §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency / SCA scan (security-design.md §2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: npm audit (SCA)
        run: npm audit --audit-level=high
        continue-on-error: true # remove once a baseline/allowlist exists
