[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdd-init"
version = "2.0.0"
description = "SDD Framework CLI — initialize and upgrade Spec-Driven Development packs"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "questionary>=2.0",
]
keywords = ["sdd", "spec-driven-development", "ai", "sdlc", "claude"]
license = { text = "MIT" }

[project.scripts]
sdd = "sdd.__main__:cli"

[project.urls]
Repository = "https://github.com/sunil1983us/universalguide"

[tool.hatch.build.targets.wheel]
packages = ["sdd"]
