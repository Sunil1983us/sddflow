# Quality Gate (AI-5) — GitLab CI
# Mirrors the rules in .github/workflows/quality-gate.yml (GitHub Actions),
# translated into GitLab CI's native syntax. Only one of these CI files
# will ever actually run — whichever matches where this repo is hosted; the
# other formats are inert extra files.
#
# NOT exercised against a live GitLab CI account by the framework's own
# CI (this repo's CI is GitHub-hosted) — treat as a starter template like
# quality-gate.yml itself: adjust build/test commands for your Tech Stack
# (constitution.md Part 2), and verify once against your actual pipeline.
#
#  - PR size (max_lines_per_pr / max_files_per_pr from manifest.yml)
#  - PR references TASK-NNN or CHG-NNN (constitution.md Git rule)
#  - Build + tests + coverage gate (constitution Part 2 — Coverage Gate)
#  - Secret scan (security-design.md §2)
#  - Dependency / SCA scan (security-design.md §2)
#
# Defaults assume a Node-based app (React/Vue/Angular/React Native) + npm.
#
# Runs only on merge-request pipelines — CI_MERGE_REQUEST_* variables are
# only populated in that context (native PR-title/description access, no
# extra credentials needed, unlike Bitbucket).

stages:
  - verify
  - build
  - security

variables:
  GIT_DEPTH: "0"   # full history — needed for the diff-based size check

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pr-size-check:
  stage: verify
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - apk add --no-cache git bash grep coreutils
  script:
    - MAX_LINES=$(grep -A2 'pr_rules:' .specify/manifest.yml | grep max_lines_per_pr | grep -o '[0-9]\+')
    - MAX_FILES=$(grep -A2 'pr_rules:' .specify/manifest.yml | grep max_files_per_pr | grep -o '[0-9]\+')
    - MAX_LINES=${MAX_LINES:-400}; MAX_FILES=${MAX_FILES:-5}
    - FILES_CHANGED=$(git diff --name-only "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" | wc -l)
    - LINES_CHANGED=$(git diff --shortstat "$CI_MERGE_REQUEST_DIFF_BASE_SHA" "$CI_COMMIT_SHA" | grep -oE '[0-9]+ insertion|[0-9]+ deletion' | grep -oE '[0-9]+' | paste -sd+ | bc || echo 0)
    - echo "Files changed:$FILES_CHANGED (limit $MAX_FILES)  Lines changed:$LINES_CHANGED (limit $MAX_LINES)"
    - if [ "$FILES_CHANGED" -gt "$MAX_FILES" ]; then echo "PR touches $FILES_CHANGED files — exceeds max_files_per_pr ($MAX_FILES). Split per the SPLIT A/B/C contract." && exit 1; fi
    - if [ "$LINES_CHANGED" -gt "$MAX_LINES" ]; then echo "PR changes $LINES_CHANGED lines — exceeds max_lines_per_pr ($MAX_LINES). Split per the SPLIT A/B/C contract." && exit 1; fi
    - if ! echo "$CI_MERGE_REQUEST_TITLE $CI_MERGE_REQUEST_DESCRIPTION" | grep -qE 'TASK-[0-9]+|CHG-[0-9]+'; then echo "MR title/description must reference TASK-NNN or CHG-NNN (constitution.md Git rule)." && exit 1; fi

build-test-coverage:
  stage: build
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npm ci
    - npm run lint --if-present
    - npm run typecheck --if-present
    - npm test -- --coverage
    - npm run build --if-present
    - echo "Coverage gate enforced via coverage.thresholds in vitest.config.ts / jest.config.js"

secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - gitleaks detect --source . --no-git -v

dependency-scan:
  stage: security
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  script:
    - npm audit --audit-level=high

# ── Optional: performance gate (full scope) ──────────────────────────────────
# Uncomment to enforce the PERF-NNN thresholds from qa-testcases.md at CI
# time. See constitution.md Part 2 Testing row for the tool choice.
